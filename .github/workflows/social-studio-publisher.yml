name: Social Studio Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: elite-smiles-social-studio-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish due approved social posts
        env:
          CRON_SECRET: ${{ secrets.META_PROCESSOR_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          response_file="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 \
            --output "$response_file" \
            -H "X-Elite-Cron-Secret: $CRON_SECRET" \
            "https://hi.elitesmilesutah.com/crm/app/api/social_studio_publish_cron.php?limit=10"
          jq -c '{ok, processed, published, failed}' "$response_file"
