name: Deploy to BanaHosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated main branch to production
        required: true
        default: false
        type: boolean

concurrency:
  group: elite-smiles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: curl
          coverage: none

      - name: Install production dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Build production Lead Agent CSS
        run: |
          npm ci --no-audit --no-fund
          npm run build:lead-agent-css
          git diff --exit-code -- assets/css/lead-agent.css

      - name: Validate PHP syntax
        run: |
          git ls-files '*.php' | while IFS= read -r file; do
            php -l "$file"
          done

      - name: Run automated tests
        run: |
          for test_file in tests/*_test.php; do
            php "$test_file"
          done

  deploy:
    name: deploy-production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://hi.elitesmilesutah.com/crm/
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: curl
          coverage: none

      - name: Build production bundle
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader
          npm ci --no-audit --no-fund
          npm run build:lead-agent-css
          git diff --exit-code -- assets/css/lead-agent.css

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: strict
          timeout: ${{ secrets.FTP_TIMEOUT || 120000 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/hi.elitesmilesutah.com/crm/' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.md
            .semgrepignore
            node_modules/**
            tests/artifacts/**
            .env
            error_log
            **/error_log
            storage/logs/**
            storage/meta-webhooks/**
            storage/smile-design/**
            public/uploads/**
            deploy-backups/**
            docs/**
            .chrome-*/
            _local_preview_*.php
            /*.png
            /*.jpg
            /*.zip
            _live_site/**
            site-root/**
            tools/**

      - name: Verify deployed CRM health
        env:
          HEALTH_SECRET: ${{ secrets.META_PROCESSOR_SECRET }}
        run: |
          test -n "$HEALTH_SECRET"
          health_body="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            --output "$health_body" --write-out '%{http_code}' \
            -H "X-Elite-Health-Secret: $HEALTH_SECRET" \
            -H "Accept: application/json" \
            "https://hi.elitesmilesutah.com/crm/health.php" || true)"
          cat "$health_body"
          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]] && jq -e '.ok == true' "$health_body" >/dev/null 2>&1; then
            exit 0
          fi
          echo "Health verification failed or did not return an ok JSON response (HTTP $http_code)." >&2
          exit 1
