name: Deploy to BanaHosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: ${{ secrets.FTP_SECURITY || 'loose' }}
          timeout: ${{ secrets.FTP_TIMEOUT || 120000 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/hi.elitesmilesutah.com/crm/' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .env
            error_log
            **/error_log
            storage/logs/**
            storage/meta-webhooks/**
            storage/smile-design/**
            public/uploads/**
            deploy-backups/**
            docs/**
            .chrome-*/
            _local_preview_*.php
            /*.png
            /*.jpg
            /*.zip
            _live_site/**
            site-root/**
            tools/**
            HANDOFF_*.md
