name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install "semgrep==1.175.0"
      - name: Scan PHP and workflows
        run: semgrep scan --config p/php --config p/github-actions --sarif --output semgrep.sarif --metrics off .
      - name: Fail on high-severity findings
        run: semgrep scan --config p/php --config p/github-actions --severity ERROR --error --metrics off .
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 90
      - name: Upload results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: semgrep.sarif
