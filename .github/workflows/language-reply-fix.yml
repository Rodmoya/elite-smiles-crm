name: Deploy language reply recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elite-language-reply-recovery
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - run: php tests/lead_agent_language_reply_test.php
      - name: Validate and deploy only reviewed live changes
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/hi.elitesmilesutah.com/crm/' }}
        run: python3 bin/deploy-language-reply.py
