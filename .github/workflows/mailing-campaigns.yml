name: Mailing Campaigns Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Send one controlled AI campaign to the configured practice mailbox"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send due mailing campaign batches
        env:
          CRON_SECRET: ${{ secrets.ELITE_LEAD_AGENT_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "X-Elite-Cron-Secret: $CRON_SECRET" \
            "https://hi.elitesmilesutah.com/crm/app/api/mailing_send_cron.php"
      - name: Run controlled practice-mailbox validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
        env:
          CRON_SECRET: ${{ secrets.ELITE_LEAD_AGENT_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "X-Elite-Cron-Secret: $CRON_SECRET" \
            "https://hi.elitesmilesutah.com/crm/app/api/mailing_e2e_test.php"
